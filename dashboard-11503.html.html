<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洋美環境維護｜財務儀表板總覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0C2340;
    --blue: #0C447C;
    --accent: #1A7FBC;
    --gold: #C9A84C;
    --green: #1A7A4A;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --border: #DDE3EC;
    --text: #1A2333;
    --muted: #6B7A99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Serif TC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    color: white;
    padding: 48px 40px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 60px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
  }
  .company { font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
  .title { font-size: 32px; font-weight: 700; letter-spacing: 2px; }
  .subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
  .gold-line { width: 60px; height: 3px; background: var(--gold); margin: 20px auto 0; border-radius: 2px; }

  .container { max-width: 900px; margin: 0 auto; padding: 48px 24px; }

  .year-section { margin-bottom: 40px; }
  .year-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .year-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .month-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
    display: block;
  }
  .month-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transition: transform 0.2s;
  }
  .month-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(12,68,124,0.12);
    border-color: var(--accent);
  }
  .month-card:hover::before { transform: scaleX(1); }

  .month-card.latest {
    background: linear-gradient(135deg, var(--navy), var(--blue));
    border-color: transparent;
    color: white;
  }
  .month-card.latest::before { background: var(--gold); transform: scaleX(1); }
  .month-card.latest .card-month { color: rgba(255,255,255,0.6); }
  .month-card.latest .card-year { color: var(--gold); }
  .month-card.latest .card-label { color: rgba(255,255,255,0.5); }
  .month-card.latest .latest-badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .latest-badge { display: none; }
  .card-month { font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .card-year { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--blue); }
  .card-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card-arrow {
    position: absolute;
    bottom: 16px; right: 16px;
    font-size: 18px;
    color: var(--border);
    transition: color 0.2s, transform 0.2s;
  }
  .month-card:hover .card-arrow { color: var(--accent); transform: translateX(3px); }
  .month-card.latest .card-arrow { color: rgba(255,255,255,0.2); }
  .month-card.latest:hover .card-arrow { color: var(--gold); }

  .coming-card {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .coming-card .icon { font-size: 24px; margin-bottom: 8px; }

  .footer {
    text-align: center;
    padding: 32px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .header { padding: 32px 20px; }
    .title { font-size: 24px; }
    .container { padding: 32px 16px; }
  }
</style>
</head>
<body>

  <div class="gold-line"></div>

<div class="container">

    <div class="cards-grid">

      <div class="coming-card">
