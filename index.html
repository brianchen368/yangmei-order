  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Serif TC',serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .header{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);color:white;padding:48px 40px 40px;text-align:center;position:relative;overflow:hidden;}
  .company{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,0.5);margin-bottom:12px;}
  .title{font-size:32px;font-weight:700;letter-spacing:2px;}
  .subtitle{font-size:14px;color:rgba(255,255,255,0.5);margin-top:8px;font-family:'JetBrains Mono',monospace;}
  .gold-line{width:60px;height:3px;background:var(--gold);margin:20px auto 0;border-radius:2px;}
  .container{max-width:900px;margin:0 auto;padding:48px 24px;}
  .year-section{margin-bottom:40px;}
  .year-label{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:12px;}
  .year-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .month-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden;display:block;}
  .month-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transition:transform .2s;}
  .month-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(12,68,124,0.12);border-color:var(--accent);}
  .month-card:hover::before{transform:scaleX(1);}
  .month-card.latest{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent;color:white;}
  .month-card.latest::before{background:var(--gold);transform:scaleX(1);}
  .month-card.latest .card-month{color:rgba(255,255,255,0.6);}
  .month-card.latest .card-year{color:var(--gold);}
  .month-card.latest .card-label{color:rgba(255,255,255,0.5);}
  .latest-badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:1px;margin-bottom:8px;}
  .card-month{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  .card-year{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--blue);}
  .card-label{font-size:12px;color:var(--muted);margin-top:4px;}
  .card-arrow{position:absolute;bottom:16px;right:16px;font-size:18px;color:var(--border);transition:color .2s,transform .2s;}
  .month-card:hover .card-arrow{color:var(--accent);transform:translateX(3px);}
  .month-card.latest .card-arrow{color:rgba(255,255,255,0.2);}
  .footer{text-align:center;padding:32px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;border-top:1px solid var(--border);}
</style>
